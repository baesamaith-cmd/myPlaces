<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myPlaces</title>
    <meta
      name="description"
      content="저장한 맛집을 지도 위에서 빠르게 확인하는 GitHub Pages용 MVP"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">myPlaces</p>
          <h1>온라인 지도 맛집 저장 MVP</h1>
          <p class="subtitle">
            캡처 이미지를 올리면 OCR로 텍스트를 읽고, 장소 정보를 파싱한 뒤 지도에
            미리보기/저장까지 할 수 있어요.
          </p>
        </div>

        <section class="panel upload-panel">
          <div class="section-title-row">
            <h2>캡처에서 장소 추가</h2>
            <span class="helper">MVP</span>
          </div>
          <label class="upload-label" for="imageUpload">이미지 업로드</label>
          <input id="imageUpload" type="file" accept="image/*" />
          <p id="selectedFileName" class="helper-text">선택된 파일이 없습니다.</p>
          <div class="button-row">
            <button id="runOcrButton" type="button" class="primary-button">
              OCR 실행
            </button>
            <button id="previewButton" type="button" class="secondary-button">
              지도에 미리보기
            </button>
          </div>
          <p id="ocrStatus" class="status-message" aria-live="polite">
            이미지를 선택하고 OCR 실행을 눌러주세요.
          </p>

          <div class="form-grid">
            <label>
              가게 이름
              <input id="parsedName" type="text" placeholder="예: JJ Sarawak Noodle" />
            </label>
            <label>
              주소
              <input
                id="parsedAddress"
                type="text"
                placeholder="예: 3 Yung Sheng Rd, 03-127, Singapore 618499"
              />
            </label>
            <label>
              영업시간
              <input id="parsedHours" type="text" placeholder="예: 7AM - 7.30PM" />
            </label>
            <label>
              카테고리
              <input id="parsedCategory" type="text" placeholder="예: 면요리" />
            </label>
            <label>
              가까운 랜드마크
              <input id="parsedLandmark" type="text" placeholder="예: Lakeside MRT Station" />
            </label>
            <label>
              거리 메모
              <input id="parsedDistanceNote" type="text" placeholder="예: 1.6km" />
            </label>
            <label>
              가격 메모
              <input id="parsedPriceNote" type="text" placeholder="예: $4.50" />
            </label>
            <label>
              지역
              <input id="parsedArea" type="text" placeholder="예: Jurong" />
            </label>
            <label class="full-width">
              설명
              <textarea
                id="parsedDescription"
                rows="3"
                placeholder="예: Jurong's best authentic Sarawak Mee"
              ></textarea>
            </label>
          </div>

          <details class="source-details">
            <summary>OCR 원문 보기</summary>
            <pre id="sourceTextPreview" class="source-preview">아직 OCR 결과가 없습니다.</pre>
          </details>

          <div id="geocodeCandidates" class="candidate-list empty-state">
            아직 위치 후보가 없습니다.
          </div>

          <button id="saveParsedPlace" type="button" class="primary-button full-width-button">
            저장하기
          </button>
        </section>

        <section class="controls panel">
          <label for="categoryFilter">카테고리</label>
          <select id="categoryFilter">
            <option value="all">전체</option>
          </select>
        </section>

        <section class="panel list-panel">
          <div class="list-header">
            <h2>저장된 장소</h2>
            <span id="placeCount">0개</span>
          </div>
          <ul id="placeList" class="place-list"></ul>
        </section>
      </aside>

      <main class="map-panel">
        <div id="map" aria-label="맛집 지도"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
